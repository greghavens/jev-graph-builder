[project]
name = "jev-graph-builder"
version = "0.1.0"
description = "Jev-decided, harness-enriched, resumable vector property graph over PostgreSQL + pgvector"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.7.1,<0.8",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "pydantic>=2.12",
  "pydantic-settings>=2.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "pyyaml>=6",
  "httpx>=0.27",
  "structlog>=24",
  "python-igraph>=0.11",
  "leidenalg>=0.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "rapidfuzz>=3.9",
  "pysbd>=0.3.4",
  "markdown-it-py>=3",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "trafilatura>=1.12",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "pytesseract>=0.3.10",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyarrow>=16",
  "datasets>=2.20",
  "sentence-transformers>=3",
  "py3langid>=0.4.0",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "testcontainers[postgres]>=4.8", "pyflakes>=3"]

[project.scripts]
jev-graph-builder = "jev_graph_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_graph_builder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs PostgreSQL (testcontainers or JGB_TEST_DSN)",
  "live: needs JEV_GRAPH_BUILDER_LIVE=1 and real credentials",
]
