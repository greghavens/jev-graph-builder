name: summary_verify_fanout
version: 2
jev_model: jev-1.13.0
purpose: "S3 (P3) fan-out packing of `summary_verify`: a chunk's summary sentences, title and keywords checked in one call, each piece kept only when the chunk supports it. Used when `policies.extract.packing` is fanout. v2: Jev sees the whole chunk, its context (document title, heading path, document metadata) and the extraction task."
state_template:
  chunk: {untrusted: true}
  context: {untrusted: true, optional: true}
  task: {}
fanout:
  over: sentences
  max_ref: policies.extract.fanout_per_call
  untrusted: true
questions:
  verdict:
    type: choice
    fanout: true
    instructions: "`chunk` is the whole chunk text. `context` is what the extractor also saw with it: the document title, the chunk's heading path and the document's metadata. `task` is the instruction the extractor followed. How does `chunk` relate to what {{ item }} states? It may be a summary sentence, a title or a keyword for `chunk`."
    criteria:
      supports: "`chunk` states or directly shows everything the piece states, so the piece accurately describes `chunk`."
      contradicts: "`chunk` states something that is incompatible with the piece."
      says_nothing: "`chunk` neither states what the piece states nor anything incompatible with it."
gating:
  accept_when: {q: verdict, eq: supports}
