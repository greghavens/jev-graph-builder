name: train_negative
version: 1
jev_model: jev-1.13.0
purpose: "S8 retrieval_pairs: a nearby passage is a hard negative only when Jev rejects it as an answer (reject = negative)."
state_template:
  query: {max_tokens_ref: policies.query.query_state_tokens, untrusted: true}
  passage: {max_tokens_ref: policies.segment.chunk_state_tokens, untrusted: true}
questions:
  answers:
    type: noul
    instructions: "`passage` contains information that answers `query`, fully or in part."
gating:
  accept_when: {q: answers, is: 'yes'}
