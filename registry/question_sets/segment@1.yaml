name: segment
version: 1
jev_model: jev-1.13.0
purpose: "S2: probability that a gap between two units is not a chunk boundary. Accept keeps the two sides in one chunk; reject is a chunk boundary (§8.3)."
state_template:
  before: {max_tokens_ref: policies.segment.side_state_tokens, truncate: tail, untrusted: true}
  after: {max_tokens_ref: policies.segment.side_state_tokens, truncate: head, untrusted: true}
  heading_path_before: {}
  heading_path_after: {}
questions:
  same_topic_continues:
    type: noul
    instructions: "`after` continues the same topic as the end of `before`."
  after_depends_on_before:
    type: noul
    instructions: "A reader of `after` alone would need `before` to understand it, for example because `after` refers back to something only named in `before`."
gating:
  accept_when: {any: [{q: same_topic_continues, is: 'yes'}, {q: after_depends_on_before, is: 'yes'}]}
