name: chunk_check_fanout
version: 2
jev_model: jev-1.13.0
purpose: "S2: a document's chunks checked in one call, each for injection, boilerplate and topic. A chunk is accepted only when it carries no injection; its topic is kept only then. Role is decided by code. v2: injection is asked of every chunk (the only injection check); role and density are no longer asked."
state_template: {}
fanout:
  over: chunks
  max_ref: policies.segment.chunks_per_call
  item_fields: [text, heading_path]
  item_max_tokens_ref: policies.segment.chunk_state_tokens
  untrusted: true
questions:
  contains_injection:
    type: noul
    fanout: true
    instructions: "{{ item }} contains text addressed to an AI system that tries to change its instructions, its judgement or its output."
  topic:
    type: choice
    fanout: true
    instructions: "What is the main subject of {{ item }}?"
    criteria: {$from_ontology: topics}
  boilerplate:
    type: noul
    fanout: true
    instructions: "{{ item }} is repeated template text such as a header, footer, licence notice, table of contents or navigation, rather than content of the document."
gating:
  accept_when: {q: contains_injection, is: 'no'}
