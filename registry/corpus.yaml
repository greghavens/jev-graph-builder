# Corpus descriptor (§7.1). S0 proposes changes to this Registry; humans approve them.
name: engineering-docs
scope: >-
  Technical documentation for a software platform: architecture notes, design
  documents, runbooks, API references, incident reviews and tutorials written by
  the platform's engineering teams. Marketing copy, personal notes and documents
  about unrelated subjects are out of scope.
languages: [en]
doc_sources: ["docs/**/*.md", "docs/**/*.pdf", "docs/**/*.docx", "docs/**/*.html", "docs/**/*.txt"]
uses: [semantic_search, graph_rag, training_data]
training_templates: [qa_single, qa_multihop, facts]   # what teaches the corpus: Q&A over every fact, and the facts as text
split_policy: component
